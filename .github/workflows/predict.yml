name: AutoDeploy AI - experimental build risk signal

# Advisory only. This workflow never fails the build and is never wired up
# as a required status check — see the "Using the Action" section of the
# README before adding this to a repo you actually merge code into.
on:
  push:
  pull_request:
  workflow_dispatch:  # manual re-run button, useful for testing

permissions:
  contents: read
  statuses: write        # to post the commit status
  pull-requests: write   # to post the PR comment

jobs:
  predict:
    runs-on: ubuntu-latest
    # Belt-and-suspenders on top of post_prediction.py always exiting 0
    # itself: even an infrastructure hiccup (e.g. the training data source
    # being briefly unreachable) must not make this show as a failing
    # workflow run, since it's advisory-only by design.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # The trained model (outputs/models/hgb_split_temporal.joblib, ~405 KB)
      # is committed to the repo as of the Render deployment work — a
      # deliberate exception to the general "never commit model artifacts"
      # policy, made because the file turned out to be small enough that the
      # usual reasons not to don't apply (see the README's Deployment
      # section). So the checkout step above already provides it, most of
      # the time. The cache + train-on-miss logic below is a safety net for
      # the case that stops being true — someone forks this repo without the
      # committed model, or a future change reverts to gitignoring it —
      # checked via hashFiles() directly rather than the cache step's own
      # cache-hit output, so it correctly recognizes "the file is already
      # here" regardless of whether checkout or cache is what provided it.
      # Retraining pays the full cost once (downloads TravisTorrent, ~1-2
      # min observed) and caches the result for any run after that until the
      # training scripts change.
      - name: Cache trained model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: outputs/models/hgb_split_temporal.joblib
          key: autodeploy-model-v1-${{ hashFiles('scripts/01_fetch_data.py', 'scripts/02_prepare_dataset.py', 'scripts/03_build_features.py', 'scripts/05_train_and_evaluate.py', 'scripts/config.py', 'requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model (only if not already present from git or cache)
        if: hashFiles('outputs/models/hgb_split_temporal.joblib') == ''
        continue-on-error: true  # let post_prediction.py report "could not score" honestly instead of just going red
        run: |
          python scripts/01_fetch_data.py
          python scripts/02_prepare_dataset.py
          python scripts/03_build_features.py
          python scripts/05_train_and_evaluate.py

      # Always runs, even if training above failed — post_prediction.py
      # checks whether the model actually loaded and posts an honest
      # "could not score" message rather than nothing at all.
      - name: Extract features, predict, and post the result
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/post_prediction.py
